name: Daily RISC-V SAIL Simulation

on:
  # 1. Schedule: Runs at 08:00 UTC every day
  schedule:
    - cron: '0 8 * * *'

  # 2. Manual Trigger: Allows you to click "Run workflow" in GitHub UI to test it immediately
  workflow_dispatch:

jobs:
  run-simulation:
    runs-on: ubuntu-latest
    # Set timeout to prevent stuck builds consuming all your minutes (SAIL build takes ~10m)
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Make script executable
        run: chmod +x run_demo.sh

      - name: Execute Simulation Script
        # This runs your script which generates source, builds the container, and runs the ELF
        run: ./run_demo.sh